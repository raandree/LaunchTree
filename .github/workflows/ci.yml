# Continuous integration pipeline for LaunchTree.
#
# LaunchTree is a Windows-only product: the build compiles the single-file
# executables with the .NET Framework C# compiler that ships with Windows, and
# the tests exercise WPF, the Windows Shell and the Windows Event Log. Every
# job therefore runs on a Windows worker; there is no Linux or macOS leg.
#
#   * Build  - calculate the version with GitVersion, build and package the
#              module (module, single-file scripts, single-file executables and
#              the nupkg), then publish the output/ folder as a build artifact.
#   * Test   - reuse the build artifact and run the Sampler test workflow on
#              both supported hosts, PowerShell 7 and Windows PowerShell 5.1.
#              Windows PowerShell 5.1 is the default Launcher Host, so a
#              host-dependent regression must not hide behind a green
#              PowerShell 7 run.
#   * Deploy - on the upstream repository, for pushes to main or v* tags,
#              publish the release to GitHub and the PowerShell Gallery and
#              raise the changelog pull request.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   GitHubToken     - token used to create the GitHub release and the changelog
#                     pull request.
#   GalleryApiToken - PowerShell Gallery API key used to publish the module.
# Every publish task is token-gated, so a missing secret skips that task
# instead of failing the run.
name: CI

# Azure DevOps renames each run to the GitVersion number via
# ##vso[build.updatebuildnumber]. GitHub Actions has no equivalent: run-name is
# evaluated before any job starts and can only see the github/inputs contexts,
# so it cannot contain a version GitVersion computes mid-run. The closest we can
# get is: show the version in the run title for tag releases (the tag IS the
# version), and stamp the computed GitVersion value into the test/deploy job
# names and the build job summary on every run (see the build job's outputs).
run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || '' }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '!v*-*'
    paths-ignore:
      - CHANGELOG.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  buildArtifactName: output
  defaultBranch: main

jobs:
  build:
    name: Package Module
    runs-on: windows-latest
    # Expose the GitVersion value to downstream jobs so they can show it in their
    # display names - the closest GitHub gets to Azure DevOps' run renaming.
    outputs:
      fullSemVer: ${{ steps.gitversion.outputs.FullSemVer }}
      nuGetVersion: ${{ steps.gitversion.outputs.NuGetVersionV2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion needs the full history to calculate the version.
          fetch-depth: 0

      - name: Calculate ModuleVersion (GitVersion)
        id: gitversion
        shell: pwsh
        env:
          # GitVersion 5.x targets an older .NET; allow it to run on the
          # runner's newer shared framework. GitVersion.yml uses the 5.x schema,
          # so the major version is pinned.
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          dotnet tool install --global GitVersion.Tool --version 5.*
          $env:PATH += [System.IO.Path]::PathSeparator + (Join-Path -Path $HOME -ChildPath '.dotnet\tools')
          $gitVersionObject = dotnet-gitversion | ConvertFrom-Json
          $gitVersionObject.PSObject.Properties.ForEach{
              Write-Host -Object "Setting output '$($_.Name)' with value '$($_.Value)'."
              "$($_.Name)=$($_.Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          Write-Host -Object "ModuleVersion (FullSemVer): $($gitVersionObject.FullSemVer)"
          "## LaunchTree $($gitVersionObject.FullSemVer)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Build & Package Module
        shell: pwsh
        env:
          ModuleVersion: ${{ steps.gitversion.outputs.NuGetVersionV2 }}
        run: ./build.ps1 -ResolveDependency -Tasks pack

      - name: Publish Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.buildArtifactName }}
          path: output/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test ${{ needs.build.outputs.fullSemVer }} (${{ matrix.edition }})
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 'pwsh' is PowerShell 7, 'powershell' is Windows PowerShell 5.1.
          - edition: PowerShell 7
            shell: pwsh
            slug: ps7
          - edition: Windows PowerShell 5.1
            shell: powershell
            slug: wps51
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.buildArtifactName }}
          path: output/

      - name: Run Tests
        shell: ${{ matrix.shell }}
        run: ./build.ps1 -Tasks test

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.slug }}
          path: output/testResults/
          if-no-files-found: warn

  deploy:
    name: Deploy Module ${{ needs.build.outputs.fullSemVer }}
    needs: [build, test]
    runs-on: windows-latest
    # Only deploy from the upstream repository, for pushes to the default
    # branch or for version tags. GitVersion.yml declares main a release branch
    # without a prerelease tag, so a push to main carries a stable version and
    # publishes as one. Both publish tasks stay inert until the repository holds
    # the secrets below.
    if: >-
      github.repository_owner == 'raandree' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.buildArtifactName }}
          path: output/

      - name: Publish Release
        shell: pwsh
        env:
          GitHubToken: ${{ secrets.GitHubToken }}
          GalleryApiToken: ${{ secrets.GalleryApiToken }}
          ModuleVersion: ${{ needs.build.outputs.nuGetVersion }}
          ReleaseBranch: ${{ env.defaultBranch }}
          MainGitBranch: ${{ env.defaultBranch }}
        run: ./build.ps1 -Tasks publish

      - name: Send Changelog PR
        shell: pwsh
        env:
          GitHubToken: ${{ secrets.GitHubToken }}
          ReleaseBranch: ${{ env.defaultBranch }}
          MainGitBranch: ${{ env.defaultBranch }}
        run: ./build.ps1 -Tasks Create_ChangeLog_GitHub_PR
